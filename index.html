<style>
:root{
    --navy:#071827;
    --navy2:#0d2639;
    --gold:#b8893e;
    --gold2:#d4ad68;
    --cream:#f8f5ef;
    --white:#ffffff;
    --text:#182b3a;
    --muted:#687783;
    --line:#e9e2d6;
    --shadow:0 18px 45px rgba(7,24,39,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",sans-serif;
    background:var(--cream);
    color:var(--text);
    overflow-x:hidden;
}

img{
    display:block;
    width:100%;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    background:rgba(7,24,39,.96);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(212,173,104,.18);
}

.navbar{
    max-width:1450px;
    margin:auto;
    min-height:82px;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    line-height:.85;
    min-width:165px;
}

.logo-main{
    color:#d4ad68;
    font-family:"Playfair Display",serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:4px;
}

.logo-sub{
    color:#fff;
    font-size:10px;
    letter-spacing:4px;
    margin-top:7px;
    opacity:.9;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:22px;
    color:#fff;
    font-size:13px;
    font-weight:500;
}

.nav-links a{
    position:relative;
    transition:.25s;
}

.nav-links a:hover{
    color:var(--gold2);
}

.nav-links a::after{
    content:"";
    position:absolute;
    bottom:-9px;
    left:0;
    width:0;
    height:1px;
    background:var(--gold2);
    transition:.25s;
}

.nav-links a:hover::after{
    width:100%;
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.lang{
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
    border-radius:30px;
    padding:8px 12px;
    background:transparent;
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:760px;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;
    background:
      linear-gradient(90deg,rgba(4,18,29,.86),rgba(4,18,29,.42),rgba(4,18,29,.12)),
      url("https://images.unsplash.com/photo-1741918265297-510c428d04c3?auto=format&fit=crop&fm=jpg&q=90&w=1800")
      center/cover no-repeat;
}

.hero-content{
    width:min(1200px,92%);
    margin:120px auto 0;
    color:white;
}

.hero-kicker{
    color:#e1bd78;
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:13px;
    font-weight:700;
    margin-bottom:18px;
}

.hero h1{
    max-width:800px;
    font-family:"Playfair Display",serif;
    font-size:clamp(54px,8vw,100px);
    line-height:.92;
    letter-spacing:2px;
}

.hero h1 span{
    color:#d4ad68;
}

.hero-text{
    max-width:650px;
    margin:25px 0;
    color:rgba(255,255,255,.88);
    font-size:18px;
    line-height:1.7;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:13px;
    margin-top:28px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:14px 23px;
    border-radius:5px;
    font-weight:700;
    font-size:14px;
    transition:.25s;
}

.btn-gold{
    background:var(--gold);
    color:white;
}

.btn-gold:hover{
    background:#9e7433;
    transform:translateY(-2px);
}

.btn-outline{
    border:1px solid rgba(255,255,255,.55);
    color:#fff;
    background:rgba(255,255,255,.05);
}

.btn-outline:hover{
    background:#fff;
    color:var(--navy);
}

.hero-search{
    margin-top:45px;
    width:min(850px,100%);
    background:white;
    border-radius:8px;
    padding:8px;
    display:flex;
    box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.hero-search input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    padding:15px;
    font-size:15px;
}

.hero-search button{
    border:0;
    background:var(--gold);
    color:white;
    border-radius:5px;
    padding:0 24px;
    font-weight:700;
}

/* =========================
   INTRO
========================= */

.intro{
    padding:90px 20px 45px;
    text-align:center;
}

.section-kicker{
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:12px;
    font-weight:700;
    margin-bottom:10px;
}

.section-title{
    font-family:"Playfair Display",serif;
    font-size:clamp(34px,5vw,52px);
    color:var(--navy);
    margin-bottom:15px;
}

.section-text{
    max-width:720px;
    margin:auto;
    color:var(--muted);
    line-height:1.7;
}

/* =========================
   SERVICES
========================= */

.services{
    max-width:1450px;
    margin:auto;
    padding:35px 22px 100px;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:42px 25px;
}

.service-card{
    text-align:center;
}

.service-image{
    position:relative;
    height:190px;
    overflow:hidden;
    border-radius:24px;
    box-shadow:var(--shadow);
}

.service-image img{
    height:100%;
    object-fit:cover;
    transition:transform .5s;
}

.service-card:hover .service-image img{
    transform:scale(1.06);
}

.service-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg,rgba(7,24,39,.25),transparent 60%);
}

.service-icon{
    position:absolute;
    z-index:2;
    left:50%;
    bottom:-38px;
    transform:translateX(-50%);
    width:88px;
    height:88px;
    border-radius:22px;
    background:#fffaf0;
    border:1px solid #e8dcc6;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    box-shadow:0 12px 28px rgba(0,0,0,.16);
}

.service-icon svg{
    width:43px;
    height:43px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.5;
}

.service-info{
    padding:54px 15px 0;
}

.service-info h3{
    font-family:"Playfair Display",serif;
    font-size:28px;
    color:var(--navy);
    margin-bottom:9px;
}

.service-info p{
    color:var(--muted);
    line-height:1.55;
    font-size:15px;
    max-width:350px;
    margin:auto;
}

/* =========================
   DESTINATIONS
========================= */

.destinations{
    background:#fff;
    padding:100px 22px;
}

.destinations-inner{
    max-width:1450px;
    margin:auto;
}

.destination-grid{
    margin-top:45px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.destination{
    position:relative;
    height:360px;
    border-radius:16px;
    overflow:hidden;
    color:white;
    box-shadow:var(--shadow);
}

.destination img{
    height:100%;
    object-fit:cover;
    transition:.6s;
}

.destination:hover img{
    transform:scale(1.07);
}

.destination::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg,rgba(4,16,26,.86),transparent 65%);
}

.destination-content{
    position:absolute;
    z-index:2;
    left:25px;
    right:20px;
    bottom:24px;
}

.destination-content small{
    color:#e2bd77;
    text-transform:uppercase;
    letter-spacing:2px;
}

.destination-content h3{
    font-family:"Playfair Display",serif;
    font-size:31px;
    margin-top:5px;
}

.destination-content p{
    margin-top:5px;
    color:rgba(255,255,255,.82);
}

/* =========================
   EXPERIENCES
========================= */

.experiences{
    padding:100px 22px;
    background:var(--cream);
}

.experience-grid{
    max-width:1450px;
    margin:45px auto 0;
    display:grid;
    grid-template-columns:1.35fr .8
