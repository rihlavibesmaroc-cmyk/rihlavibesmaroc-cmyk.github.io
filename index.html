<style>
:root{
  --navy:#071827;
  --navy2:#0d2438;
  --gold:#d5ad59;
  --gold2:#f0d28b;
  --cream:#f8f5ee;
  --white:#ffffff;
  --text:#182532;
  --muted:#687582;
  --line:#e8e1d4;
  --shadow:0 18px 50px rgba(7,24,39,.12);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  width:100%;
  display:block;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* TOP BAR */
.topbar{
  background:#05121e;
  color:#d9e0e5;
  font-size:13px;
  padding:9px 0;
}

.topbar-inner{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.topbar span{
  opacity:.9;
}

/* HEADER */
header{
  background:rgba(7,24,39,.98);
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid rgba(213,173,89,.25);
}

.nav{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  line-height:.9;
  min-width:190px;
}

.logo-main{
  color:var(--gold2);
  font-size:27px;
  font-weight:900;
  letter-spacing:5px;
}

.logo-sub{
  color:white;
  font-size:20px;
  font-weight:700;
  letter-spacing:8px;
  margin-top:5px;
}

.logo-tag{
  font-size:8px;
  letter-spacing:3px;
  color:#c7d0d7;
  margin-top:7px;
}

.menu{
  display:flex;
  align-items:center;
  gap:22px;
  font-size:13px;
  font-weight:600;
}

.menu a{
  color:#eef3f5;
  transition:.25s;
}

.menu a:hover{
  color:var(--gold2);
}

.lang{
  display:flex;
  gap:5px;
  border:1px solid rgba(255,255,255,.18);
  padding:5px;
  border-radius:20px;
}

.lang span{
  padding:5px 8px;
  font-size:11px;
}

.lang span:first-child{
  background:var(--gold);
  color:var(--navy);
  border-radius:15px;
  font-weight:bold;
}

.mobile-menu{
  display:none;
  font-size:25px;
}

/* HERO */
.hero{
  min-height:690px;
  position:relative;
  display:flex;
  align-items:center;
  background:
    linear-gradient(90deg,rgba(3,15,25,.88),rgba(3,15,25,.53),rgba(3,15,25,.18)),
    url("https://images.unsplash.com/photo-1741918265297-510c428d04c3?auto=format&fit=crop&fm=jpg&q=90&w=1800")
    center/cover no-repeat;
}

.hero-content{
  color:white;
  max-width:760px;
  padding:90px 0;
}

.kicker{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:var(--gold2);
  font-size:13px;
  letter-spacing:3px;
  text-transform:uppercase;
  font-weight:bold;
  margin-bottom:18px;
}

.kicker:before{
  content:"";
  width:38px;
  height:1px;
  background:var(--gold);
}

.hero h1{
  font-size:clamp(48px,8vw,88px);
  line-height:.92;
  letter-spacing:3px;
  margin-bottom:25px;
}

.hero h1 span{
  color:var(--gold2);
}

.hero p{
  font-size:19px;
  max-width:650px;
  color:#eef2f3;
  margin-bottom:32px;
}

.buttons{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:15px 25px;
  border-radius:5px;
  font-weight:bold;
  font-size:14px;
  transition:.25s;
}

.btn-gold{
  background:var(--gold);
  color:var(--navy);
}

.btn-gold:hover{
  background:var(--gold2);
  transform:translateY(-2px);
}

.btn-outline{
  border:1px solid rgba(255,255,255,.65);
  color:white;
}

.btn-outline:hover{
  background:white;
  color:var(--navy);
}

/* SEARCH */
.search-box{
  background:white;
  box-shadow:var(--shadow);
  border-radius:8px;
  padding:10px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:8px;
  margin-top:-38px;
  position:relative;
  z-index:5;
}

.search-item{
  padding:15px 17px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#fff;
}

.search-item small{
  display:block;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:4px;
}

.search-item strong{
  font-size:14px;
}

.search-button{
  border:0;
  background:var(--navy);
  color:white;
  border-radius:5px;
  padding:0 28px;
  font-weight:bold;
  cursor:pointer;
}

/* TRUST */
.trust{
  background:white;
  border-bottom:1px solid var(--line);
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:25px 0;
  gap:15px;
}

.trust-item{
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:center;
  border-right:1px solid var(--line);
}

.trust-item:last-child{
  border:0;
}

.trust-icon{
  font-size:24px;
}

.trust-item strong{
  display:block;
  font-size:13px;
}

.trust-item small{
  color:var(--muted);
  font-size:11px;
}

/* SECTIONS */
section{
  padding:90px 0;
}

.section
