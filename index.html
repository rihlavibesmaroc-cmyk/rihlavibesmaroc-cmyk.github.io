  box-sizing:border-box;
  margin:0;
  padding:0;

html{
  scroll-behavior:smooth;

body{

}

img{

  max-width:100%;
}

.container{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

.site-header{
  position:fixed;
  top:0;
  left:0;

  z-index:1000;

  border-bottom:1px solid rgba(244,189,69,.2);

  display:flex;

  width:48px;
  height:48px;

.brand-name{
  font-family:"Playfair Display",serif;
  font-size:29px;
  font-style:italic;
  font-weight:800;
  color:var(--gold);
  line-height:.9;
}

.brand-tag{
  font-size:9px;
  letter-spacing:.8px;
  color:#ffe9ad;
  margin-top:5px;
  white-space:nowrap;
}

.main-nav{
  display:flex;
  justify-content:center;
  gap:25px;
  flex:1;
}

.main-nav a{
  font-size:13px;
  color:#e6edf5;
  transition:.25s;
}

.main-nav a:hover{
  color:var(--gold);
}

.lang-switch{
  display:flex;
  align-items:center;
  gap:3px;
  border:1px solid rgba(244,189,69,.75);
  border-radius:30px;
  padding:4px;
  background:rgba(0,0,0,.25);
}

.lang-switch button{
  border:0;
  background:transparent;
  color:#fff;
  border-radius:22px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:700;
  font-size:12px;
}

.lang-switch button.active{
  background:var(--gold);
  color:#07111d;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}
